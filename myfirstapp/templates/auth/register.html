{% extends 'base.html' %}
<!--tells jinja that this template should replace the blocks from base.html-->
<!--rendered content must appear inside the block-->

{% block header %}
    <h1>{% block title %} Register {% endblock %}</h1>
    <!--block title inside block header = set title block and then output its value into header block-->
    <!--both window and page share the same title without writing it twice-->
{% endblock %}

{% block content %}
    <form method="post">
        <label for="name">Name: </label>
        <input name="name" id="name" required>
        <label for="password">password: </label>
        <input type="password" name="password" id="password" required>
        <label for="email">email address: </label>
        <input name="email" id="email" required>
        <label for="phone">phone number: </label>
        <input name="phone" id="phone" required>
        <label for="type">I am a:</label>
        <select id="type" name="type">
            <option value="customer">Customer</option> <!--MUST BE SMALL CAPS!!!-->
            <option value="designer">Designer</option>
            <option value="platform">Platform manager</option>
        </select>
        <input type="submit" value="register">
    </form>
{% endblock %}
